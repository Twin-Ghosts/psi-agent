# 单人专用容器配置: 只有 AI + 一个 Session, **不含飞书通道**。
#
# 飞书 WS 长连接仍然只在主容器 (同一个飞书 app 只能维持一条 WS, 两个容器各连一份会互相
# 抢消息)。主容器的 gateway 经 PSI_FEISHU_EXTERNAL_SESSIONS 把这个人的 open_id 指到本容器
# 的 TCP 地址, 消息由主容器转发进来, 回复顺原路出去。
#
# 隔离点在于: 本容器有自己的 volume, 主容器与其他用户的 agent 连这里的文件系统都触不到,
# 而不只是靠工具层守卫拦路径。凭据同样走 .env, 不写在本文件里。

# AI 后端: provider/model/api_key/base_url 全部回落到 PSI_AI_* 环境变量。
- type: ai
  session_socket: /tmp/psi/ai.sock

# 唯一的 Session: 监听 TCP 供主容器 gateway 连接 (Unix socket 跨不了容器)。
# 0.0.0.0 是容器内监听地址; 端口不 publish 到宿主, 只在 compose 网络内可达。
- type: session
  workspace: /workspace
  ai_socket: /tmp/psi/ai.sock
  channel_socket: http://0.0.0.0:8081
